name: Build and Upload Conda Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Auto-cancel superseded runs for the same ref (tags get unique refs, so a
# publishing tag run is never cancelled by a later branch push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python }}
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge conda-build anaconda-client

      - name: Build conda package
        shell: bash -el {0}
        run: |
          conda-build ci/conda -c conda-forge --python=${{ matrix.python }}

      - name: Upload to Anaconda.org
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash -el {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda -t $ANACONDA_TOKEN upload --force $(conda-build ci/conda -c conda-forge --python=${{ matrix.python }} --output)
